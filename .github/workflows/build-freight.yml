name: Create Freight & Logistics (alpha)
on:
  push:
    branches:
      - create-freight-logistics-prototype
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build NeoForge mod
        run: gradle build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: create-freight-logistics-alpha
          path: build/libs/*.jar
          if-no-files-found: error
