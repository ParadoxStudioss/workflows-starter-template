name: Create Freight & Logistics Integration Build
on:
  push:
    branches:
      - create-freight-logistics-prototype
      - create-freight-logistics-v0.1.2
      - create-freight-logistics-v0.1.3-integration
      - create-freight-logistics-v0.1.4-generation
      - create-freight-logistics-v0.1.5-terrain
      - create-freight-logistics-v0.1.5.1-alpha
      - create-freight-logistics-v0.1.5.2-alpha
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build NeoForge mod
        run: gradle build --stacktrace --no-daemon
      - name: Validate compiled jar resources
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,glob,json
          jars=glob.glob('build/libs/create-freight-logistics-*.jar')
          assert len(jars)==1,jars
          with zipfile.ZipFile(jars[0]) as z:
              names=set(z.namelist())
              required=[
                  'META-INF/neoforge.mods.toml',
                  'site/paradoxstudios/freight/FreightLogistics.class',
                  'site/paradoxstudios/freight/RackBlockEntity.class',
                  'site/paradoxstudios/freight/ManagementMenu.class',
                  'site/paradoxstudios/freight/client/ManagementScreen.class',
                  'site/paradoxstudios/freight/RailStopFeature.class',
                  'site/paradoxstudios/freight/DepotAutomation.class',
                  'site/paradoxstudios/freight/RailwayNetworkGenerator.class',
                  'site/paradoxstudios/freight/RailwayTerrain.class',
                  'site/paradoxstudios/freight/RailwayCurveBuilder.class',
                  'site/paradoxstudios/freight/RailwayAlignment.class',
                  'site/paradoxstudios/freight/RailwayStationBuilder.class',
                  'site/paradoxstudios/freight/RailwayGenerationService.class',
                  'site/paradoxstudios/freight/RailwayGenerationConfig.class',
                  'site/paradoxstudios/freight/StationChunkLoading.class',
                  'site/paradoxstudios/freight/FreightDisplaySource.class',
                  'site/paradoxstudios/freight/WarehouseBlockEntity.class',
                  'site/paradoxstudios/freight/client/FreightPonderPlugin.class',
                  'assets/freightlogistics/ponder/guides/server_rack.nbt',
                  'assets/freightlogistics/models/block/server_rack.json',
                  'assets/freightlogistics/models/block/crossing_barrier_closed.json',
                  'assets/freightlogistics/lang/en_us.json',
                  'data/freightlogistics/worldgen/configured_feature/railway_stop.json',
                  'data/freightlogistics/worldgen/placed_feature/railway_stop.json',
                  'site/paradoxstudios/freight/RailwayNetworkGenerator$StationRequest.class'
              ]
              missing=[n for n in required if n not in names]
              assert not missing,missing
              for n in names:
                  if n.endswith('.json') and (n.startswith('assets/freightlogistics/') or n.startswith('data/freightlogistics/')):
                      json.loads(z.read(n))
              print('Verified',jars[0],len(names),'files and JSON parsing')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: create-freight-logistics-0.1.5.2-alpha
          path: build/libs/*.jar
          if-no-files-found: error
