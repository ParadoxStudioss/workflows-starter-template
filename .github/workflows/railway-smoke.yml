name: Railway Generation Runtime Smoke Test
on:
  push:
    branches:
      - create-freight-logistics-v0.1.4-generation
      - create-freight-logistics-v0.1.5-terrain
      - create-freight-logistics-v0.1.5.1-alpha
      - create-freight-logistics-v0.1.5.2-alpha
  workflow_dispatch:
jobs:
  fresh-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Start fresh Minecraft / Create test server, verify railway and station
        shell: bash
        run: |
          mkdir -p run
          printf "eula=true\n" > run/eula.txt
          printf "level-seed=8723651\nlevel-name=world\nonline-mode=false\nmax-players=1\nview-distance=6\nsimulation-distance=5\nenable-rcon=true\nrcon.password=local-smoke-railway-only\nrcon.port=25575\n" > run/server.properties
          timeout 260s gradle runServer --no-daemon --console=plain > smoke.log 2>&1 &
          server_pid=$!
          set +e
          python3 tools/smoke_railway.py
          result=$?
          if [ "$result" != 0 ]; then
            tail -n 100 smoke.log
          fi
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          exit "$result"
      - name: Upload logs for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-generation-smoke-logs
          path: smoke.log
          if-no-files-found: ignore
