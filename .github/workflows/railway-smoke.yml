name: Railway Generation Runtime Smoke Test
on:
  push:
    branches:
      - create-freight-logistics-v0.1.4-generation
  workflow_dispatch:
jobs:
  fresh-world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Create a fresh local test-world configuration
        run: |
          mkdir -p run
          printf "eula=true\n" > run/eula.txt
          printf "level-seed=8723651\nlevel-name=world\nonline-mode=false\nmax-players=1\nview-distance=6\nsimulation-distance=5\n" > run/server.properties
      - name: Start a fresh NeoForge + Create dedicated server
        shell: bash
        run: |
          set +e
          timeout 180s gradle runServer --no-daemon --console=plain > smoke.log 2>&1
          status=$?
          set -e
          tail -n 100 smoke.log
          if grep -Eq "Done \\([0-9.]+s\\)!|Done \\([0-9.]+s\\)" smoke.log; then
            echo "Dedicated Minecraft server reached the ready state."
          else
            echo "Minecraft server did not reach the ready state (exit code: $status)."
            exit 1
          fi
          if grep -Ei "\\[.*(ERROR|FATAL).*\\].*(freightlogistics|RailwayNetworkGenerator|RailwayGenerationService)" smoke.log; then
            echo "Mod-specific runtime errors were logged."
            exit 1
          fi
          if ! grep -q "Generated railway segment" smoke.log; then
            echo "No railway generation logged. This test should generate a segment near origin."
            exit 1
          fi
      - name: Upload logs for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-generation-smoke-logs
          path: smoke.log
          if-no-files-found: ignore
