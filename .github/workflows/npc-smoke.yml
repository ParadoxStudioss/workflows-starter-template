name: NPC Freight Train Real Assembly Test
on:
  push:
    branches:
      - create-freight-logistics-v0.1.5.3-alpha-npc
  workflow_dispatch:
jobs:
  dual-freight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Real Create NPC train assembly and scheduling smoke
        shell: bash
        run: |
          mkdir -p run
          printf "eula=true\n" > run/eula.txt
          printf "level-seed=9753137\nlevel-name=world\nonline-mode=false\nmax-players=1\nview-distance=6\nsimulation-distance=5\nenable-rcon=true\nrcon.password=local-npc-rail-smoke\nrcon.port=25576\n" > run/server.properties
          timeout 660s gradle runServer --no-daemon --console=plain > npc-smoke.log 2>&1 &
          PID=$!
          set +e
          python3 tools/smoke_npc.py
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            tail -n 160 npc-smoke.log
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          exit "$CODE"
      - name: Upload NPC test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-train-live-smoke-logs
          path: npc-smoke.log
          if-no-files-found: ignore
