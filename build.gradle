plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.3'
group = 'site.paradoxstudios'
base { archivesName = 'create-freight-logistics' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
}
dependencies {
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
}
neoForge {
    version = '21.1.248'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { freightlogistics { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets.main.resources.srcDir("src/generated/resources")
tasks.register('generateFreightAssets', Exec) {
    commandLine 'python3', 'tools/generate_assets.py'
}
tasks.named('processResources') { dependsOn 'generateFreightAssets' }
